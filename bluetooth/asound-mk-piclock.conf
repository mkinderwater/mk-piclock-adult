# Shared software-mixed playback path for mk-clock local audio and Bluetooth A2DP.
# Local application audio uses mkpiclock_mix unchanged.
# Bluetooth uses a dedicated dual-mono route so both stereo source channels are
# preserved on the clock's single-speaker MAX98357A output.

pcm.mkpiclock_dmix {
    type dmix
    ipc_key 0x4d4b434c
    ipc_key_add_uid false
    ipc_perm 0666
    slave {
        pcm "hw:MAX98357A,0"
        format S16_LE
        rate 48000
        channels 2
        period_time 100000
        periods 5
    }
}

pcm.mkpiclock_mix {
    type plug
    slave.pcm "mkpiclock_dmix"
}

# Fixed-rate Bluetooth sink for bluealsa-aplay when its adaptive libsamplerate
# support is available.  Preserve the complete stereo program as dual mono,
# but retain about 1.5 dB of peak headroom to protect the small single-speaker
# output from hard transients/rattle: out-L = 0.42*L + 0.42*R and the same for
# out-R.  This is a fixed, zero-cost safety margin rather than a tone-changing
# compressor; local MP3/alarm playback is unaffected.
pcm.mkpiclock_bt_hq {
    type route
    slave {
        pcm "mkpiclock_dmix"
        channels 2
    }
    ttable.0.0 0.42
    ttable.1.0 0.42
    ttable.0.1 0.42
    ttable.1.1 0.42
}

# Compatibility path for bluealsa-aplay builds without --resampler support.
# ALSA plug performs any required sample-rate conversion, while the inner route
# still performs the same stereo-to-dual-mono mix.
pcm.mkpiclock_bt_compat {
    type plug
    slave.pcm "mkpiclock_bt_hq"
}
